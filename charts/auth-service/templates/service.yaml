apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-%s" .Release.Name .Chart.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Chart.Name }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Chart.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
{{- if .Values.canary.enabled }}
---
# Canary-only Service: lets the post-deploy k6 gate test the canary in isolation.
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-%s-canary" .Release.Name .Chart.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Chart.Name }}
    track: canary
spec:
  type: ClusterIP
  selector:
    app: {{ .Chart.Name }}
    track: canary
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
{{- end }}
