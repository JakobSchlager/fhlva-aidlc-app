replicaCount: 1

image:
  repository: ""
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  port: 80

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60

serviceAccount:
  name: frontend

# Deployment update strategy, e.g. maxSurge: 0 on small clusters (values-minikube.yaml). Empty = Kubernetes default.
strategy: {}

env: {}

# Canary track (Lab 4): a second Deployment next to the stable one. Off by default.
canary:
  enabled: false
  tag: ""
  replicas: 1
  # Environment overrides for the canary only, merged over env.
  env: {}
