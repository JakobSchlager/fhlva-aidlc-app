global:
  image:
    registry: ""
    tag: "latest"

# Renders the "beer-tracker" Namespace. Set to false when the release lives in another,
# pre-created namespace (for example the GitOps stages beer-tracker-staging / beer-tracker-prod).
namespace:
  create: true

ingress:
  # Set to false for releases that should not take the cluster's ingress paths (e.g. a staging stage).
  enabled: true
  class: "azure/application-gateway"
  tls:
    enabled: true

# Per-service value overrides.
# Each key matches the sub-chart name; values are merged with that chart's defaults.

auth-service:
  image:
    repository: ""
    tag: "latest"
    pullPolicy: IfNotPresent
  replicaCount: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60
  serviceAccount:
    name: auth-service
  env: {}

beer-tracking-service:
  image:
    repository: ""
    tag: "latest"
    pullPolicy: IfNotPresent
  replicaCount: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60
  serviceAccount:
    name: beer-tracking-service
  env: {}

health-notification-service:
  image:
    repository: ""
    tag: "latest"
    pullPolicy: IfNotPresent
  replicaCount: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60
  serviceAccount:
    name: health-notification-service
  env: {}

statistics-service:
  image:
    repository: ""
    tag: "latest"
    pullPolicy: IfNotPresent
  replicaCount: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60
  serviceAccount:
    name: statistics-service
  env: {}

frontend:
  image:
    repository: ""
    tag: "latest"
    pullPolicy: IfNotPresent
  replicaCount: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60
  serviceAccount:
    name: frontend
  env: {}

# k6 gate as a Helm test (see load/README.md). Off by default.
loadTest:
  enabled: false
  image: docker.io/grafana/k6:2.3.0
  # Environment for the gate pod, e.g. RATE or DURATION. Services with canary.enabled are
  # tested through their <service>-canary Service automatically.
  # Keys set here override the template's defaults (PROFILE=gate and the release's service URLs).
  env: {}
