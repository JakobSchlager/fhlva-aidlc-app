global:
  image:
    registry: ""
    tag: "latest"

ingress:
  class: "azure/application-gateway"
  tls:
    enabled: true

# Per-service value overrides.
# Each key matches the sub-chart name; values are merged with that chart's defaults.

auth-service:
  image:
    repository: ""
    tag: "latest"
    pullPolicy: IfNotPresent
  replicaCount: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60
  serviceAccount:
    name: auth-service
  env: {}

beer-tracking-service:
  image:
    repository: ""
    tag: "latest"
    pullPolicy: IfNotPresent
  replicaCount: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60
  serviceAccount:
    name: beer-tracking-service
  env: {}

