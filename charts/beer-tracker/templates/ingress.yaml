apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: beer-tracker
    app.kubernetes.io/managed-by: Helm
  annotations:
    kubernetes.io/ingress.class: {{ .Values.ingress.class | quote }}
    {{- if eq .Values.ingress.class "azure/application-gateway" }}
    appgw.ingress.kubernetes.io/ssl-redirect: "true"
    {{- end }}
spec:
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - beer-tracker.local
      secretName: beer-tracker-tls
  {{- end }}
  rules:
    - http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: {{ printf "%s-%s" .Release.Name "auth-service" }}
                port:
                  number: 8081
          - path: /tracking
            pathType: Prefix
            backend:
              service:
                name: {{ printf "%s-%s" .Release.Name "beer-tracking-service" }}
                port:
                  number: 8082
          - path: /notifications
            pathType: Prefix
            backend:
              service:
                name: {{ printf "%s-%s" .Release.Name "health-notification-service" }}
                port:
                  number: 8083
          - path: /statistics
            pathType: Prefix
            backend:
              service:
                name: {{ printf "%s-%s" .Release.Name "statistics-service" }}
                port:
                  number: 8084
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ printf "%s-%s" .Release.Name "frontend" }}
                port:
                  number: 80
