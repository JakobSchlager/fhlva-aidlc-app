{{- if .Values.loadTest.enabled }}
# k6 gate as a Helm test: `helm test <release>` runs the gate profile from load/
# against this release's services. Needs the k6-scripts ConfigMap in the release
# namespace (kubectl apply -k load/). See load/README.md.
apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-k6-gate
  namespace: {{ .Release.Namespace }}
  labels:
    app: k6-gate
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
  containers:
    - name: k6
      image: {{ .Values.loadTest.image }}
      args: ["run", "/load/script.js"]
      workingDir: /load
      env:
        {{- $r := .Release.Name }}
        {{- /* A service with an enabled canary is tested through its canary-only Service. */}}
        {{- $host := dict }}
        {{- range $svc := list "frontend" "auth-service" "beer-tracking-service" "statistics-service" "health-notification-service" }}
        {{- $canary := (index $.Values $svc).canary | default dict }}
        {{- $_ := set $host $svc (printf "%s-%s%s" $r $svc (ternary "-canary" "" (eq ($canary.enabled | toString) "true"))) }}
        {{- end }}
        {{- $defaults := dict
              "PROFILE" "gate"
              "USERS" "5"
              "RUN_NAME" (printf "helm-test-%s-r%d" $r .Release.Revision)
              "BASE_URL" (printf "http://%s:80" $host.frontend)
              "AUTH_URL" (printf "http://%s:8081" (index $host "auth-service"))
              "TRACKING_URL" (printf "http://%s:8082" (index $host "beer-tracking-service"))
              "STATISTICS_URL" (printf "http://%s:8084" (index $host "statistics-service"))
              "NOTIFICATIONS_URL" (printf "http://%s:8083" (index $host "health-notification-service")) }}
        {{- range $name, $value := merge (deepCopy .Values.loadTest.env) $defaults }}
        - name: {{ $name }}
          value: {{ $value | quote }}
        {{- end }}
      resources:
        requests:
          cpu: 250m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 512Mi
      volumeMounts:
        - name: scripts
          mountPath: /load
          readOnly: true
  volumes:
    - name: scripts
      configMap:
        name: k6-scripts
{{- end }}
