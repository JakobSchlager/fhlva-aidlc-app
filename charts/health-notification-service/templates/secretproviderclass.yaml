{{- if eq .Values.secretsProvider "azure" }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ printf "%s-%s-secret-provider" .Release.Name .Chart.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Chart.Name }}
spec:
  provider: azure
  secretObjects:
    - secretName: {{ printf "%s-%s-secrets" .Release.Name .Chart.Name }}
      type: Opaque
      data:
        - objectName: notifications-db-password
          key: notifications-db-password
        - objectName: internal-api-key
          key: internal-api-key
  parameters:
    keyvaultName: {{ .Values.keyVault.name | quote }}
    tenantId: {{ .Values.keyVault.tenantId | quote }}
    useVMManagedIdentity: "false"
    usePodIdentity: "false"
    clientID: {{ .Values.workloadIdentity.clientId | quote }}
    objects: |
      array:
        - |
          objectName: notifications-db-password
          objectType: secret
          objectVersion: ""
        - |
          objectName: internal-api-key
          objectType: secret
          objectVersion: ""
{{- end }}
