# Replaces the base image's containers.conf, which forces host namespaces (netns, userns, ipcns,
# utsns, cgroupns = "host") and disables cgroups. That breaks minikube's node container
# ("cannot set hostname when running in the host UTS namespace"). No systemd here, hence cgroupfs.
[containers]
log_driver = "k8s-file"

[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"
runtime = "crun"
