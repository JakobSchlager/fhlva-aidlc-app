# Replaces the base image's containers.conf, which forces host namespaces (netns, userns, ipcns,
# utsns, cgroupns = "host") and disables cgroups. That breaks minikube's node container
# ("cannot set hostname when running in the host UTS namespace"). No systemd here, hence cgroupfs.
[containers]
log_driver = "k8s-file"
# No per-container pids limit (Podman's default is 2048). systemd in the minikube node sets each pod
# container's TasksMax to 15% of the node's limit: 307 with the default. ingress-nginx runs one worker per
# CPU at about 33 threads each, and a config reload briefly runs old and new workers side by side; with
# 5 CPUs that exceeded 307, workers failed pthread_create and were not respawned, and about 2 in 5
# requests through the ingress hung (macOS, 2026-10-09). The devcontainer's own limit still caps the total.
pids_limit = 0

[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"
runtime = "crun"
