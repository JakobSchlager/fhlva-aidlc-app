ingress:
  class: nginx
  tls:
    enabled: false

auth-service:
  image:
    repository: auth-service
    tag: latest
    pullPolicy: Never
  # Small cluster: replace pods one at a time instead of starting an extra JVM first
  # (with maxSurge > 0 an upgrade briefly runs old and new pod side by side; on a 4-6 GiB minikube
  # that extra JVM caused OOM kills, rehearsal 2026-11-23). Costs a few seconds of downtime for a
  # service with one replica.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  env:
    SPRING_DATASOURCE_URL: "jdbc:postgresql://postgresql:5432/auth_db"
    SPRING_DATASOURCE_USERNAME: "postgres"
    AUTH_PRIVATE_KEY_PATH: "/etc/secrets/auth-rs256-private-key"

beer-tracking-service:
  image:
    repository: beer-tracking-service
    tag: latest
    pullPolicy: Never
  # Same as auth-service: no extra pod during upgrades.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  env:
    SPRING_DATASOURCE_URL: "jdbc:postgresql://postgresql:5432/tracking_db"
    SPRING_DATASOURCE_USERNAME: "postgres"
    JWKS_URI: "http://beer-tracker-auth-service:8081/auth/.well-known/jwks.json"

health-notification-service:
  image:
    repository: health-notification-service
    tag: latest
    pullPolicy: Never
  # Same as auth-service: no extra pod during upgrades.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  env:
    SPRING_DATASOURCE_URL: "jdbc:postgresql://postgresql:5432/notifications_db"
    SPRING_DATASOURCE_USERNAME: "postgres"
    JWKS_URI: "http://beer-tracker-auth-service:8081/auth/.well-known/jwks.json"
    BEER_TRACKING_INTERNAL_URL: "http://beer-tracker-beer-tracking-service:8082"

statistics-service:
  image:
    repository: statistics-service
    tag: latest
    pullPolicy: Never
  # Same as auth-service: no extra pod during upgrades.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  env:
    SPRING_DATASOURCE_URL: "jdbc:postgresql://postgresql:5432/statistics_db"
    SPRING_DATASOURCE_USERNAME: "postgres"
    JWKS_URI: "http://beer-tracker-auth-service:8081/auth/.well-known/jwks.json"
    BEER_TRACKING_INTERNAL_URL: "http://beer-tracker-beer-tracking-service:8082"

frontend:
  image:
    repository: frontend
    tag: latest
    pullPolicy: Never
