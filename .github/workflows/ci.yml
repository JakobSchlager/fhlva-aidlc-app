name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    name: Build, Test, and Push Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run tests — auth-service
        working-directory: services/auth-service
        run: mvn test --batch-mode

      - name: Run tests — beer-tracking-service
        working-directory: services/beer-tracking-service
        run: mvn test --batch-mode

      - name: Run tests — health-notification-service
        working-directory: services/health-notification-service
        run: mvn test --batch-mode

      - name: Run tests — statistics-service
        working-directory: services/statistics-service
        run: mvn test --batch-mode

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ env.REGISTRY }}

      - name: Build and push — auth-service
        uses: docker/build-push-action@v5
        with:
          context: ./services/auth-service
          push: true
          tags: ${{ env.REGISTRY }}/auth-service:${{ env.IMAGE_TAG }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/auth-service:cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/auth-service:cache,mode=max

      - name: Build and push — beer-tracking-service
        uses: docker/build-push-action@v5
        with:
          context: ./services/beer-tracking-service
          push: true
          tags: ${{ env.REGISTRY }}/beer-tracking-service:${{ env.IMAGE_TAG }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/beer-tracking-service:cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/beer-tracking-service:cache,mode=max

      - name: Build and push — health-notification-service
        uses: docker/build-push-action@v5
        with:
          context: ./services/health-notification-service
          push: true
          tags: ${{ env.REGISTRY }}/health-notification-service:${{ env.IMAGE_TAG }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/health-notification-service:cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/health-notification-service:cache,mode=max

      - name: Build and push — statistics-service
        uses: docker/build-push-action@v5
        with:
          context: ./services/statistics-service
          push: true
          tags: ${{ env.REGISTRY }}/statistics-service:${{ env.IMAGE_TAG }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/statistics-service:cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/statistics-service:cache,mode=max

      - name: Build and push — frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/frontend:${{ env.IMAGE_TAG }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/frontend:cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/frontend:cache,mode=max

  deploy:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --name ${{ secrets.AKS_CLUSTER_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --overwrite-existing

      - name: Deploy with Helm
        run: |
          helm upgrade --install beer-tracker ./charts/beer-tracker \
            --namespace beer-tracker \
            --create-namespace \
            --set image.tag=${{ env.IMAGE_TAG }} \
            --set image.registry=${{ env.REGISTRY }} \
            --set keyVault.name=${{ secrets.KEY_VAULT_NAME }} \
            --set keyVault.tenantId=${{ secrets.AZURE_TENANT_ID }} \
            --wait \
            --timeout 10m

  playwright-e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Generate local dev RS256 key
        run: |
          mkdir -p secrets
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
            -out secrets/auth-rs256-private-key.pem

      - name: Start stack with docker-compose
        run: |
          docker compose up -d --build
          echo "Waiting for services to become healthy..."
          timeout 300 bash -c '
            until docker compose ps | grep -E "(healthy|running)" | wc -l | grep -q "^[6-9]"; do
              echo "Still waiting..."; sleep 10
            done
          '

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: e2e/package.json

      - name: Install Playwright and dependencies
        working-directory: e2e
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Run Playwright tests
        working-directory: e2e
        run: npm run test:e2e
        env:
          BASE_URL: http://localhost:8080

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
