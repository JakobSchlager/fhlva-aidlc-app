server:
  port: 8084

spring:
  application:
    name: statistics-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/statistics_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWKS_URI}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,readiness,liveness
      base-path: /actuator
  health:
    probes:
      enabled: true
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

app:
  tracking:
    internalUrl: ${BEER_TRACKING_INTERNAL_URL:http://beer-tracking-service:8083}
    internalApiKey: ${INTERNAL_API_KEY}
  statistics:
    cacheRefreshMinutes: 15
    # ISO 8601 duration used by @Scheduled fixedRateString
    cacheRefreshInterval: PT15M
